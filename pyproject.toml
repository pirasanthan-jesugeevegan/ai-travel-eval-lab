[project]
name = "travel-ai-eval"
version = "0.1.0"
description = "Evaluation harness for a synthetic AI travel recommendation layer"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_ai_eval"]

[tool.pytest.ini_options]
# Plain `pytest` is offline-only; run the paid suite explicitly: pytest tests/evaluation
testpaths = ["tests/unit"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests/unit"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Inline HTML/SVG/CSS strings read better unwrapped.
"src/travel_ai_eval/reporting/html_*.py" = ["E501"]
"tests/**" = ["E501"]
"src/travel_ai_eval/ai/prompts.py" = ["E501"]  # prompt text is not wrapped
