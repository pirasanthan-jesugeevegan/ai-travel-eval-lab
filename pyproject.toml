[project]
name = "travel-ai-eval"
version = "0.1.0"
description = "Evaluation harness for a synthetic AI travel recommendation layer"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_ai_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
