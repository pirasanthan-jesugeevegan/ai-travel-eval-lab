name: Evaluation

# CI makes no Anthropic calls on push or PR. The AI evaluation is run locally
# (uv run python -m travel_ai_eval.evaluation.runner), its result is committed to
# reports/history.jsonl, and CI publishes the trend report from that committed history.
# The AI evaluation job below only runs when triggered by hand.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (offline, no API calls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run pytest tests/unit

  build-report:
    name: Build trend report from committed history (offline)
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Render report.html from reports/history.jsonl
        run: |
          uv run python -m travel_ai_eval.reporting.html_report
          mkdir site
          cp reports/report.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-report:
    name: Publish trend report (GitHub Pages)
    needs: build-report
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  ai-evaluation:
    name: AI evaluation (manual only, spends Anthropic credits)
    needs: unit-tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Optional repo variable; falls back to the default model when unset.
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Run AI evaluation (fails the build if the quality gate fails)
        run: uv run pytest tests/evaluation -s
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: |
            reports/latest.json
            reports/history.jsonl
            reports/report.html
          if-no-files-found: ignore
